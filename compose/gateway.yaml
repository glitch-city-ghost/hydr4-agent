services:
  gateway:
    image: ghcr.io/tashfeenahmed/freellmapi@sha256:da6829d4ae510b968aa8bea6817a3647f5396c312392bbf44f47942d0aec2d96
    container_name: hydr4-gateway
    ports:
      - "127.0.0.1:3001:3001" # <--- Localhost only
    env_file:
      # Gateway-specific public settings live in configs/gateway/freellmapi/.
      - ../.env
      - ../configs/gateway/freellmapi/freellmapi.env
    environment:
      # Host-specific egress proxy. The value itself stays in root .env.
      - HTTP_PROXY=${UPSTREAM_PROXY}
      - HTTPS_PROXY=${UPSTREAM_PROXY}
    volumes:
      - ~/hydr4-data/gateway:/app/server/data
    networks:
      - agent-net
      - traefik-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`api.localhost`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.services.gateway.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
