services:
  gateway:
    image: ghcr.io/tashfeenahmed/freellmapi@sha256:da6829d4ae510b968aa8bea6817a3647f5396c312392bbf44f47942d0aec2d96
    container_name: hydr4-gateway
    ports:
      - "127.0.0.1:3001:3001" # <--- Localhost only
    env_file:
      # Gateway-specific public settings live in configs/gateway/freellmapi/.
      - ../.env
      - ../configs/gateway/freellmapi/freellmapi.env
    environment:
      # Host-specific egress proxy. The value itself stays in root .env.
      - HTTP_PROXY=${UPSTREAM_PROXY}
      - HTTPS_PROXY=${UPSTREAM_PROXY}
    volumes:
      - ~/hydr4-data/gateway:/app/server/data
    networks:
      - agent-net
      - traefik-net
    restart: unless-stopped
    healthcheck:
      # Gateway-agnostic: depends on bash and its /dev/tcp builtin, not on node
      # (FreeLLMAPI only) or curl (some images only).
      # It reads the response through fd 3, never from stdin, and passes on the
      # first bytes. "Listening but broken" is still caught by ./hydra check.
      # The agent depends on this healthcheck, so it must not fail over a provider
      # outage. Do not add an HTTP status check here unless the gateway is known to
      # answer without touching its providers.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/3001 2>/dev/null && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && IFS= read -r -t 3 -n 12 body <&3 && [ -n \"$body\" ]"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`api.localhost`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.services.gateway.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
