services:
  agent:
    profiles: ["dsh", "opencode"]
    build:
      context: ../docker/universal-agent
      dockerfile: Dockerfile
    container_name: hydr4-agent
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:4096:4096"
    environment:
      - AGENT_BACKEND=${AGENT_BACKEND:-opencode}
      - OPENAI_BASE_URL=http://gateway:3001/v1
      - HYDRA_API_KEY=${FREELMAPI_UNIFIED_KEY}
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD}
      - OPENCODE_CONFIG=/configs/backends/opencode/config.json
      - EXA_API_KEY=${EXA_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS=false
      - HTTP_PROXY=${UPSTREAM_PROXY:-}
      - HTTPS_PROXY=${UPSTREAM_PROXY:-}
      - http_proxy=${UPSTREAM_PROXY:-}
      - https_proxy=${UPSTREAM_PROXY:-}
      - NO_PROXY=gateway,gateway:3001,hydr4-gateway,hydr4-agent,localhost,.localhost,127.0.0.1,::1,api.github.com,github.com,raw.githubusercontent.com,objects.githubusercontent.com,codeload.github.com
      - no_proxy=gateway,gateway:3001,hydr4-gateway,hydr4-agent,localhost,.localhost,127.0.0.1,::1,api.github.com,github.com,raw.githubusercontent.com,objects.githubusercontent.com,codeload.github.com
      - GIT_CONFIG_GLOBAL=/home/agent/.config/.gitconfig
      - GH_TOKEN_FILE=/home/agent/.secrets/github/token
    volumes:
      - ../../workspace:/workspace
      - ~/hydr4-data/agent/config:/home/agent/.config
      - ~/hydr4-data/agent/local-share:/home/agent/.local/share/opencode
      - ../configs:/configs:ro
      - ~/hydr4-data/secrets/ssh:/home/agent/.ssh:ro
      - ~/hydr4-data/secrets/github:/home/agent/.secrets/github:ro
    networks:
      - agent-net
      - traefik-net
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:4096/global/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent.rule=Host(`agent.localhost`)"
      - "traefik.http.routers.agent.entrypoints=web"
      - "traefik.http.services.agent.loadbalancer.server.port=4096"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
